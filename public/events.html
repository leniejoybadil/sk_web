<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>

<title>Event Registration</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:radial-gradient(circle at top,#065f46,#0f172a);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
    margin:0;
}

.container{
    width:100%;
    max-width:520px;
    padding:20px;
}

.title{
    text-align:center;
    font-size:35px;
    font-weight:bold;
    margin-bottom:30px;
    color:#6ee7b7;
}

.card{

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:22px;

padding:25px;

box-shadow:0 15px 35px rgba(0,0,0,.25);

}

.eventBtn{

width:100%;

padding:16px;

margin-bottom:15px;

border:none;

border-radius:16px;

font-size:18px;

font-weight:bold;

cursor:pointer;

color:white;

background:linear-gradient(135deg,#059669,#10b981);

transition:.3s;

}

.eventBtn:hover{

transform:translateY(-4px);

box-shadow:0 12px 25px rgba(16,185,129,.4);

}

.seatBtn{

width:100%;

padding:18px;

margin-top:8px;

border:none;

border-radius:16px;

font-size:19px;

font-weight:bold;

cursor:pointer;

background:linear-gradient(135deg,#f59e0b,#dc2626);

color:white;

transition:.3s;

}

.seatBtn:hover{

transform:scale(1.03);

}

.back{

display:block;

text-align:center;

margin-top:25px;

color:#d1d5db;

text-decoration:none;

}

.back:hover{

color:white;

}

.modal{

position:fixed;

inset:0;

display:none;

justify-content:center;

align-items:center;

background:rgba(0,0,0,.65);

backdrop-filter:blur(5px);

z-index:999;

}

.modal-content{

background:white;

color:black;

padding:25px;

border-radius:20px;

width:95%;

max-width:420px;

}

.modal input{

width:100%;

padding:12px;

margin-bottom:12px;

border:1px solid #d1d5db;

border-radius:12px;

}

.modal input:focus{

outline:none;

border-color:#10b981;

box-shadow:0 0 0 3px rgba(16,185,129,.2);

}

.submit{

width:100%;

padding:14px;

background:#059669;

color:white;

border:none;

border-radius:12px;

font-weight:bold;

cursor:pointer;

}

.cancel{

width:100%;

padding:14px;

margin-top:10px;

background:#d1d5db;

border:none;

border-radius:12px;

cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h1 class="title">
🎮 Event Registration
</h1>

<div class="card">

<button class="eventBtn"
onclick="openForm('Mobile Legends: Bang Bang')">
🎮 Mobile Legends
</button>

<button class="eventBtn"
onclick="openForm('Tagisan ng Talino')">
🧠 Tagisan ng Talino
</button>

<button class="eventBtn"
onclick="openForm('SK DALAGDAG GOT TALENT')">
🎤 SK Got Talent
</button>

<button class="seatBtn"
onclick="location.href='seatreservation.html'">
🪑 Seat Reservation
</button>

<a href="index.html" class="back">
← Back to Dashboard
</a>

</div>

</div>

<div class="modal" id="modal">

<div class="modal-content">

<h2 id="eventTitle"
class="text-2xl font-bold text-green-700 mb-5"></h2>

<input
id="name"
placeholder="Full Name">

<input
id="age"
type="number"
placeholder="Age">

<input
id="groupName"
placeholder="Group Name">

<input
id="file"
type="file">

<button
class="submit"
onclick="submitForm()">
Submit Registration
</button>

<button
class="cancel"
onclick="closeForm()">
Cancel
</button>

</div>

</div>

<script>

let selectedEvent="";

const scriptURL="https://script.google.com/macros/s/AKfycbxJNjFrsC1uedPyijilwNHN-rJnoQB-UXJffMuagMeMtBbnRv4Kv5qPmZ3tZmzKD41rVw/exec";

function openForm(event){

selectedEvent=event;

document.getElementById("eventTitle").innerHTML=event;

document.getElementById("modal").style.display="flex";

}

function closeForm(){

document.getElementById("modal").style.display="none";

}

function submitForm(){

const name=document.getElementById("name").value;

const age=document.getElementById("age").value;

const group=document.getElementById("groupName").value;

const file=document.getElementById("file").files[0];

if(!name||!age||!group||!file){

alert("Please complete all fields.");

return;

}

const btn=document.querySelector(".submit");

btn.disabled=true;

btn.innerHTML="Submitting...";

const reader=new FileReader();

reader.onload=e=>{

const formData=new URLSearchParams();

formData.append("event",selectedEvent);

formData.append("name",name);

formData.append("age",age);

formData.append("groupName",group);

formData.append("mimeType",file.type);

formData.append("file",e.target.result.split(",")[1]);

fetch(scriptURL,{
method:"POST",
body:formData
})
.then(()=>{

alert("Successfully Registered!");

location.reload();

})
.catch(()=>{

alert("Submission failed.");

btn.disabled=false;

btn.innerHTML="Submit Registration";

});

};

reader.readAsDataURL(file);

}

</script>

</body>
</html>
