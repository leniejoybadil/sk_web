<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>Event Registration</title>

<style>
body{
    font-family: Arial;
    background: radial-gradient(circle at top, #064e3b, #0f172a);
    color: white;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
}

/* container */
.container{
    width: 100%;
    max-width: 520px;
    padding: 18px;
}

/* floating title */
@keyframes floaty {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0px); }
}

.float {
    animation: floaty 3s ease-in-out infinite;
}

/* loader bounce */
.animate-ball {
    animation: bounce 1s infinite;
}

/* modal blur effect */
#modal{
    backdrop-filter: blur(6px);
}

/* inputs polish */
input, select{
    outline: none;
    transition: 0.2s;
}

input:focus, select:focus{
    border-color: #10b981;
    box-shadow: 0 0 0 2px rgba(16,185,129,0.3);
}

/* buttons spacing fix */
button{
    transition: 0.25s ease;
}

/* mobile spacing */
@media (max-width: 600px){
    .container{
        padding: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- TITLE -->
    <h2 class="text-3xl font-bold text-center text-green-300 mb-6 float">
         Event Registration
    </h2>

    <!-- BUTTONS -->
    <div class="grid gap-3">

        <button onclick="openForm('Giant Volleyball Game')" 
        class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-green-700 text-white font-semibold shadow-md hover:shadow-xl hover:scale-[1.03] transition-all">
            Giant Volleyball Game
        </button>

        <button onclick="openForm('Mobile Legends: Bang Bang')" 
        class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-green-700 text-white font-semibold shadow-md hover:shadow-xl hover:scale-[1.03] transition-all">
           Mobile Legends: Bang Bang
        </button>

        <button onclick="openForm('Tagisan ng Talino')" 
        class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-green-700 text-white font-semibold shadow-md hover:shadow-xl hover:scale-[1.03] transition-all">
            Tagisan ng Talino
        </button>

        <button onclick="openForm('Interpurok Chess')" 
        class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-green-700 text-white font-semibold shadow-md hover:shadow-xl hover:scale-[1.03] transition-all">
            Interpurok Chess
        </button>

        <button onclick="openForm('Snake and Ladders')" 
        class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-green-700 text-white font-semibold shadow-md hover:shadow-xl hover:scale-[1.03] transition-all">
            Snake and Ladders
        </button>

         <button onclick="openForm('SK DALAGDAG GOT TALENT')" 
        class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-green-700 text-white font-semibold shadow-md hover:shadow-xl hover:scale-[1.03] transition-all">
           SK DALAGDAG GOT TALENT
        </button>



    </div>

    <!-- BACK -->
    <button onclick="location.href='index.html'" 
    class="mt-5 text-gray-300 underline w-full">
        Back to Dashboard
    </button>

</div>

<!-- LOADER -->
<div id="loader" class="hidden fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center z-50">
    <div class="text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/889/889455.png"
             class="w-16 animate-ball mx-auto">
        <p class="text-white mt-3 font-semibold">Submitting...</p>
    </div>
</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex justify-center items-center p-3">

    <div class="bg-white text-black p-6 rounded-2xl w-full max-w-md shadow-2xl mx-2">

        <h3 id="eventTitle" class="font-bold text-xl mb-4 text-green-700"></h3>

        <input id="name" placeholder="Full Name" class="border p-2 w-full mb-2 rounded">
        <input id="age" type="number" placeholder="Age" class="border p-2 w-full mb-2 rounded">

        <select id="purok" class="border p-2 w-full mb-2 rounded">
            <option disabled selected>Select Purok</option>
            <option>Purok 1</option>
            <option>Purok 2</option>
            <option>Purok 3</option>
            <option>Purok 4</option>
            <option>Purok 5</option>
            <option>Purok 6</option>
            <option>Purok 7</option>
            <option>Purok 8</option>
            <option>Purok 9</option>
        </select>

        <input id="groupName" placeholder="Group Name" 
        class="border p-2 w-full mb-2 hidden rounded">

        <button id="submitBtn" onclick="submitForm()" 
        class="bg-blue-700 text-white w-full p-2 rounded hover:bg-blue-800 transition">
            Submit
        </button>

        <button onclick="closeForm()" 
        class="bg-gray-300 text-black w-full p-2 rounded mt-2 hover:bg-gray-400">
            Cancel
        </button>

    </div>
</div>

<script>

let selectedEvent = "";

const scriptURL = "https://script.google.com/macros/s/AKfycbxJNjFrsC1uedPyijilwNHN-rJnoQB-UXJffMuagMeMtBbnRv4Kv5qPmZ3tZmzKD41rVw/exec";

function openForm(event){
    selectedEvent = event;
    document.getElementById("eventTitle").innerText = event;
    document.getElementById("modal").classList.remove("hidden");

    const group = document.getElementById("groupName");
    const purok = document.getElementById("purok");

    // Hide both first
    group.classList.add("hidden");
    purok.classList.add("hidden");

    // Only these events use PUROK
    if(
        event === "Interpurok Chess" ||
        event === "Snake and Ladders"
    ){
        purok.classList.remove("hidden");
    }else{
        // All other events use GROUP NAME
        group.classList.remove("hidden");
    }
}

function closeForm(){
    document.getElementById("modal").classList.add("hidden");
}

/* SUBMIT */
function submitForm(){

    const name = document.getElementById("name").value;
    const age = document.getElementById("age").value;
    const purok = document.getElementById("purok").value;
    const groupName = document.getElementById("groupName").value;
    const btn = document.getElementById("submitBtn");

    // Validation
if(
    selectedEvent === "Interpurok Chess" ||
    selectedEvent === "Snake and Ladders"
){
    if(!name || !age || purok === "Select Purok"){
        alert("Please complete all required fields");
        return;
    }
}else{
    if(!name || !age || !groupName){
        alert("Please complete all required fields");
        return;
    }

    btn.innerText = "Submitting...";
    btn.disabled = true;

    document.getElementById("loader").classList.remove("hidden");

    function send(base64, filename, type){

        const formData = new URLSearchParams();
        formData.append("event", selectedEvent);
        formData.append("name", name);
        formData.append("age", age);
        formData.append("purok", purok || "N/A");
        formData.append("groupName", groupName || "N/A");
        formData.append("mimeType", type);

        fetch(scriptURL, {method:"POST", body:formData})
        .then(() => {
            document.getElementById("loader").classList.add("hidden");
            alert("Successfully Registered!");
            location.reload();
        })
        .catch(() => {
            document.getElementById("loader").classList.add("hidden");
            alert("Error submitting.");
            btn.innerText = "Submit";
            btn.disabled = false;
        });
    }

    const reader = new FileReader();
    reader.onload = e => {
        const base64 = e.target.result.split(",")[1];
        send(base64, file.name, file.type);
    };
    reader.readAsDataURL(file);
}

</script>

</body>
</html>
