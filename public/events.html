<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>Event Registration</title>

<style>
body{
    font-family: Arial;
    background: #f3f3f3;
}

.container{
    max-width: 450px;
    margin: auto;
    padding: 10px;
}

button{
    transition: 0.2s;
}
</style>
</head>

<body>

<div class="container">

    <h2 class="text-2xl font-bold text-center text-green-800 mb-4">
        Event Registration
    </h2>

    <div class="grid gap-2">

        <button onclick="openForm('Interpurok Basketball League')" class="bg-green-700 text-white p-3 rounded">
            Interpurok Basketball League (18 Above)
        </button>

        <button onclick="openForm('Interpurok Billiards')" class="bg-green-700 text-white p-3 rounded">
            Interpurok Billiards
        </button>

        <button onclick="openForm('Volleyball Tournament')" class="bg-green-700 text-white p-3 rounded">
            Volleyball Tournament
        </button>

        <button onclick="openForm('Sepak Takraw Tournament')" class="bg-green-700 text-white p-3 rounded">
            Sepak Takraw Tournament
        </button>

    </div>

    <button onclick="location.href='index.html'" class="mt-4 text-gray-600 underline w-full">
        Back to Dashboard
    </button>
</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex justify-center items-center p-3">

    <div class="bg-white p-5 rounded-lg w-full max-w-md">

        <h3 id="eventTitle" class="font-bold text-lg mb-3"></h3>

        <input id="name" placeholder="Full Name" class="border p-2 w-full mb-2">
        <input id="age" type="number" placeholder="Age" class="border p-2 w-full mb-2">

        <!-- PUROK -->
        <select id="purok" class="border p-2 w-full mb-2">
            <option disabled selected>Select Purok</option>
            <option>Purok 1</option>
            <option>Purok 2</option>
            <option>Purok 3</option>
            <option>Purok 4</option>
            <option>Purok 5</option>
            <option>Purok 6</option>
            <option>Purok 7</option>
            <option>Purok 8</option>
            <option>Purok 9</option>
        </select>

        <!-- GROUP NAME -->
        <input id="groupName" placeholder="Group Name (Volleyball / Takraw)" 
        class="border p-2 w-full mb-2 hidden">

        <!-- VALID ID -->
        <input type="file" id="validid" accept="image/*" class="w-full mb-3">

        <button id="submitBtn" onclick="submitForm()" class="bg-blue-700 text-white w-full p-2 rounded">
            Submit
        </button>

        <button onclick="closeForm()" class="bg-gray-300 text-black w-full p-2 rounded mt-2">
            Cancel
        </button>

    </div>
</div>

<script>

let selectedEvent = "";

const scriptURL = "https://script.google.com/macros/s/AKfycbyBJZtNutGRYsCBTc81lTHZGnFu6_OIJmvcIKdjK_T0K1V4NTPEz3NRbIfGn8zvmflE8g/exec";

function openForm(event){
    selectedEvent = event;
    document.getElementById("eventTitle").innerText = event;
    document.getElementById("modal").classList.remove("hidden");

    const group = document.getElementById("groupName");
    const purok = document.getElementById("purok");

    group.classList.add("hidden");
    purok.classList.remove("hidden");

    if(event.includes("Volleyball") || event.includes("Takraw")){
        group.classList.remove("hidden");
        purok.classList.add("hidden");
    }
}

function closeForm(){
    document.getElementById("modal").classList.add("hidden");
}

function submitForm(){

    const name = document.getElementById("name").value;
    const age = document.getElementById("age").value;
    const purok = document.getElementById("purok").value;
    const groupName = document.getElementById("groupName").value;
    const file = document.getElementById("validid").files[0];
    const btn = document.getElementById("submitBtn");

    if(!name || !age){
        alert("Please complete required fields");
        return;
    }

    btn.innerText = "Submitting...";
    btn.disabled = true;

    function send(base64, filename, type){

        const formData = new URLSearchParams();
        formData.append("event", selectedEvent);
        formData.append("name", name);
        formData.append("age", age);
        formData.append("purok", purok || "N/A");
        formData.append("groupName", groupName || "N/A");
        formData.append("validid", base64);
        formData.append("filename", filename);
        formData.append("mimeType", type);

        fetch(scriptURL, {method:"POST", body:formData})
        .then(() => {
            alert("Successfully Registered!");
            location.reload();
        })
        .catch(() => {
            alert("Error submitting.");
            btn.innerText = "Submit";
            btn.disabled = false;
        });
    }

    if(file){
        const reader = new FileReader();
        reader.onload = e => {
            const base64 = e.target.result.split(",")[1];
            send(base64, file.name, file.type);
        };
        reader.readAsDataURL(file);
    } else {
        send("","","");
    }
}

</script>

</body>
</html>
