<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nostalgia Fest 2026 Seat Reservation</title>

<script src="https://cdn.tailwindcss.com"></script>


<style>

body{
    background:#111827;
    font-family:'Segoe UI',sans-serif;
}


/* CHAIR */

.chair{

    width:34px;
    height:34px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
    font-weight:bold;

    color:white;

    cursor:pointer;

    transition:.2s;

}


.available{
    background:#22c55e;
}


.selected{
    background:#2563eb;
    transform:scale(1.15);
}


.reserved{
    background:#ef4444;
    cursor:not-allowed;
}




/* TABLE */

.table-area{

    background:#E8D8B9;

    padding:20px;

    border-radius:20px;

    width:330px;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:12px;

}



.row{

    display:flex;

    gap:10px;

}



.middle{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:15px;

}



.side{

    display:flex;

}



.rectangle-table{

    width:170px;

    height:95px;

    background:#B8865B;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:white;

    font-weight:bold;

}



/* RESERVED LIST */

.reserved-card{

    background:#1f2937;

    border-radius:15px;

    padding:20px;

}


.reserved-item{

    background:#374151;

    padding:12px;

    border-radius:10px;

    margin-bottom:10px;

}



</style>


</head>


<body class="text-white">


<div class="max-w-7xl mx-auto p-5">


<h1 class="text-4xl font-bold text-center">

🎮 NOSTALGIA FEST 2026

</h1>


<p class="text-center text-gray-300 mb-8">

Linggo ng Kabataan | Seat Reservation

</p>





<div class="bg-yellow-400 text-black text-center py-4 rounded-xl font-bold mb-8">

🎭 STAGE

</div>





<div class="flex justify-center gap-5 mb-8">

<span>🟢 Available</span>

<span>🔵 Selected</span>

<span>🔴 Reserved</span>

</div>





<div class="grid md:grid-cols-3 gap-8">


<!-- TABLE AREA -->

<div class="md:col-span-2">


<div id="tables"

class="grid md:grid-cols-2 gap-10 justify-items-center">

</div>


</div>





<!-- RESERVED LIST -->

<div class="reserved-card">


<h2 class="text-xl font-bold mb-5">

📋 RESERVED SEATS

</h2>



<div id="reservedList">

Loading...

</div>


</div>


</div>







<div class="bg-gray-800 max-w-md mx-auto mt-10 p-6 rounded-xl">


<h2 class="text-xl font-bold mb-4">

👤 Reservation Details

</h2>




<input id="name"

class="w-full p-3 mb-3 rounded text-black"

placeholder="Full Name">





<input id="age"

type="number"

class="w-full p-3 mb-3 rounded text-black"

placeholder="Age">





<p>

Selected Seat:

<span id="selectedSeat" class="font-bold">

None

</span>

</p>





<button onclick="reserveSeat()"

class="bg-blue-600 w-full mt-4 py-3 rounded-xl font-bold">

✅ RESERVE SEAT

</button>


<a href="index.html"

class="block text-center mt-5 text-gray-300 hover:text-white">

← Back to Dashboard

</a>


</div>




</div>

<script>


const scriptURL =
"https://script.google.com/macros/s/AKfycby70x9s8vjRC7zkAMMoyT8y7m5IfCdNcAvCRJZjtXw0bEFvBZgkHux8RRJ-Fx7TFPkDfg/exec";



let seatNumber = 1;

let selectedChair = null;


const container = document.getElementById("tables");





// CREATE CHAIR

function createChair(num){


    let chair = document.createElement("div");


    chair.className = "chair available";


    chair.innerHTML = String(num).padStart(2,"0");


    chair.dataset.seat = num;




    chair.onclick = function(){


        if(this.classList.contains("reserved")){
            return;
        }



        document.querySelectorAll(".chair")
        .forEach(c=>{

            c.classList.remove("selected");

        });



        this.classList.add("selected");


        selectedChair = this.dataset.seat;



        document.getElementById("selectedSeat").innerHTML =
        "Seat " + String(selectedChair).padStart(2,"0");



    };



    return chair;

}







// CREATE 10 TABLES

for(let tableNo=1; tableNo<=10; tableNo++){



    let area=document.createElement("div");


    area.className="table-area";




    // TOP 4 CHAIRS

    let top=document.createElement("div");

    top.className="row";



    for(let i=0;i<4;i++){

        top.appendChild(createChair(seatNumber++));

    }






    // MIDDLE

    let middle=document.createElement("div");


    middle.className="middle";



    let left=document.createElement("div");

    left.className="side";

    left.appendChild(createChair(seatNumber++));





    let table=document.createElement("div");


    table.className="rectangle-table";


    table.innerHTML="TABLE<br>"+tableNo;






    let right=document.createElement("div");

    right.className="side";


    right.appendChild(createChair(seatNumber++));





    middle.appendChild(left);

    middle.appendChild(table);

    middle.appendChild(right);







    // BOTTOM 4 CHAIRS

    let bottom=document.createElement("div");


    bottom.className="row";



    for(let i=0;i<4;i++){


        bottom.appendChild(createChair(seatNumber++));


    }






    area.appendChild(top);

    area.appendChild(middle);

    area.appendChild(bottom);



    container.appendChild(area);



}






// LOAD RESERVED WHEN PAGE OPENS

loadReservedSeats();









function loadReservedSeats(){



fetch(scriptURL)

.then(response=>response.json())


.then(data=>{



let list=document.getElementById("reservedList");


list.innerHTML="";




if(data.length===0){

list.innerHTML="No reserved seats yet.";

return;

}






data.forEach(item=>{



// TURN CHAIR RED


let seat=document.querySelector(

'.chair[data-seat="'+item.seat+'"]'

);




if(seat){


seat.classList.remove("available");


seat.classList.add("reserved");


}







// SHOW NAME LIST


list.innerHTML += `


<div class="reserved-item">


🔴 Seat ${String(item.seat).padStart(2,"0")}

<br>

👤 ${item.name}


</div>


`;



});



})


.catch(error=>{


console.log(error);


document.getElementById("reservedList").innerHTML=

"Unable to load reservations.";


});


}










function reserveSeat(){



let name=document.getElementById("name").value;


let age=document.getElementById("age").value;





if(!selectedChair){


alert("Please select a seat.");


return;


}




if(!name || !age){


alert("Please complete your details.");


return;


}






fetch(scriptURL,{


method:"POST",


mode:"no-cors",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


name:name,


age:age,


seat:selectedChair,


event:"Nostalgia Fest 2026"


})


});







let chair=document.querySelector(

'.chair[data-seat="'+selectedChair+'"]'

);




chair.classList.remove("selected");


chair.classList.add("reserved");






alert(

"✅ Reservation Complete!\n\n"+

"Name: "+name+

"\nSeat: "+selectedChair

);







document.getElementById("name").value="";


document.getElementById("age").value="";


document.getElementById("selectedSeat").innerHTML="None";



selectedChair=null;



// Refresh list

setTimeout(()=>{

loadReservedSeats();

},1000);



}



</script>


</body>

</html>
